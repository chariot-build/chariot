[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = ["BSD-3-Clause", "MIT", "MIT-0", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CDLA-Permissive-2.0"]
exceptions = [
    { name = "option-ext", allow = [ "MPL-2.0" ] }, # We dont modify, should be ok.
    { name = "aws-lc-sys", allow = [ "Apache-2.0" ] }, # cargo-deny seems to get confused here. We use the entire thing under ISC.
    { name = "sync_wrapper", allow = [ "Apache-2.0" ] }, # Contains no `NOTICE` file.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"