[workspace]
resolver = "3"
members = [
    "cli",
    "config",
    "core",
    "rootfs",
    "runtime",
    "util",
]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
authors = ["WuX"]
license = "BSD-3-Clause"

[workspace.dependencies]
chariot_config = { path = "config" }
chariot_core = { path = "core" }
chariot_rootfs = { path = "rootfs" }
chariot_runtime = { path = "runtime" }
chariot_util = { path = "util" }
nix = "0.31.2"
thiserror = "2.0.18"
toml = "1.1.2"
serde = "1.0.228"
rusqlite = { version = "0.40.1", features = ["bundled"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
